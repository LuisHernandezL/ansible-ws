plugin: amazon.aws.aws_ec2
filters:
  "tag:Name": ["ws_lh_ansible_app*"]
regions:
  - us-east-1
hostnames:
  - instance-id
compose:
  ansible_user: "'ec2-user'"
  ansible_connection: "'aws_ssm'"
  ansible_aws_ssm_bucket_name: "'ansible-ssm-transfer-314567760063'"
  ansible_aws_ssm_region: "'us-east-1'"
keyed_groups:
  - key: tags.Application
    separator: ''
